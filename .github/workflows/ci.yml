name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Instalação inicial cria lockfile apenas no runner. Fixar lockfile após
      # sua primeira geração verificada; não declarar npm ci enquanto ausente.
      - run: npm install --no-audit --no-fund
      # Em bootstrap temporário, o lockfile é disponibilizado para commit verificado.
      - run: |
          echo LOCKFILE_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_END
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
